project:
  name: eohagent_tsp_gls_qwen35_122b_mech_10x20_v5
  problem: tsp_gls
  output_dir: ./eohagent/results/tsp_gls_qwen35_122b_mech_10x20_v5

evaluator:
  mode: import
  problem: tsp_gls
  objective_direction: minimize
  function_name: update_edge_distance
  timeout: 500
  n_inst_eva: 64
  time_limit: 60
  ite_max: 1000
  perturbation_moves: 1

llm:
  provider: openai_compatible
  model: qwen3.5:122b
  api_base: http://127.0.0.1:11434/v1
  api_key: ollama
  temperature: 0.7
  max_retries: 3
  timeout: 600

evolution:
  pop_size: 10
  generations: 20
  offspring_per_generation: 10
  n_proc: 5
  max_llm_retries: 3
  max_eval_retries: 1
  parent_selection: rank
  survival_selection: family_champion
  deduplicate_code: true

selection:
  use_selection_score: false
  diversity_weight: 0.0

bootstrap:
  use_baseline_seed: true
  n_proc: 10
  seed_path: ./eohagent/seeds/tsp_gls_baseline.json

agent:
  max_steps_per_offspring: 8
  max_repairs_per_candidate: 2
  enable_dynamic_skill_selection: true
  enable_generation_planning: true
  enable_generation_reflection: true

memory:
  enable_compaction: true
  enable_generation_reflection: true
  compact_every_generation: true
  compact_token_threshold: 60000
  keep_recent_events: 80

context_management:
  enable: true
  context_window: 32768
  compact_threshold: 0.70
  chars_per_token: 3.0
  max_compaction_retries: 2
  recent_events: 12
  population_items: 8
  notebook_items: 6

generalization:
  enable_audit: false
  enable_probes: false
  probe_threshold: 0.5
  probe_weight: 0.0
  std_weight: 0.0
  tail_weight: 0.0
